<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 338" width="900" height="338" role="img" aria-label="s9y@earth: ~/dev — featured: portal">
  <defs>
    <clipPath id="sc"><rect x="1" y="1" width="898" height="336" rx="10"/></clipPath>
    <style>
      .m { font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace; font-size:14px }
      .sm { font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace; font-size:12px }
      .dim{ fill:#565f89 } .fg { fill:#c0caf5 } .cy { fill:#7dcfff }
      .gr { fill:#9ece6a } .ye { fill:#e0af68 } .ma { fill:#bb9af7 }
      .rd { fill:#f7768e } .bl { fill:#7aa2f7 } .b { font-weight:700 }
    </style>
  </defs>
  <rect x=".5" y=".5" width="899" height="337" rx="10.5" fill="#1a1b26" stroke="#2f3348"/>
  <g clip-path="url(#sc)">
    <rect x="1" y="1" width="898" height="30" fill="#16161e"/>
    <circle cx="22" cy="16" r="5.5" fill="#f7768e"/>
    <circle cx="40" cy="16" r="5.5" fill="#e0af68"/>
    <circle cx="58" cy="16" r="5.5" fill="#9ece6a"/>
    <text x="450.0" y="21" class="m dim" text-anchor="middle">s9y@earth: ~/dev — featured: portal</text>
    <text x="30" y="78" class="m"><tspan class="gr b">➜</tspan><tspan class="cy b">  ~/dev</tspan><tspan class="dim"> git:(</tspan><tspan class="rd">main</tspan><tspan class="dim">) </tspan><tspan class="fg">cat ./featured/portal.txt</tspan></text>
    <text x="30" y="106" class="m dim">├─</text>
    <text x="56" y="106" class="m b bl">what</text>
    <text x="200" y="106" class="m"><tspan class="fg">a VS Code extension that exposes your workspace as a public MCP endpoint</tspan></text>
    <text x="30" y="126" class="m dim">├─</text>
    <text x="56" y="126" class="m b bl">why</text>
    <text x="200" y="126" class="m"><tspan class="fg">deliberately minimal</tspan><tspan class="dim">  · commands + file transfer, exactly five tools</tspan></text>
    <text x="30" y="146" class="m dim">├─</text>
    <text x="56" y="146" class="m b bl">tools</text>
    <text x="200" y="146" class="m"><tspan class="fg">run_command</tspan><tspan class="dim">  · start · read · stop · file_transfer_info</tspan></text>
    <text x="30" y="166" class="m dim">├─</text>
    <text x="56" y="166" class="m b bl">files</text>
    <text x="200" y="166" class="m"><tspan class="fg">HTTP API on the same tunnel &amp; token</tspan><tspan class="dim">  · download · upload · pack · unpack</tspan></text>
    <text x="30" y="186" class="m dim">├─</text>
    <text x="56" y="186" class="m b bl">tunnels</text>
    <text x="200" y="186" class="m"><tspan class="fg">cloudflare quick · named</tspan><tspan class="dim">  · ngrok reserved · custom</tspan></text>
    <text x="30" y="206" class="m dim">├─</text>
    <text x="56" y="206" class="m b bl">extras</text>
    <text x="200" y="206" class="m"><tspan class="fg">WSL-aware shells · prompt templates · error doctor</tspan></text>
    <text x="30" y="226" class="m dim">└─</text>
    <text x="56" y="226" class="m b bl">license</text>
    <text x="200" y="226" class="m"><tspan class="fg">MIT · TypeScript · VS Code extension</tspan><tspan class="dim">  · github.com/s3hq4y/portal</tspan></text>
    <text x="30" y="256" class="m"><tspan class="gr b">➜</tspan><tspan class="cy b">  ~/dev</tspan><tspan class="dim"> git:(</tspan><tspan class="rd">main</tspan><tspan class="dim">) </tspan><tspan class="fg">portal --status</tspan></text>
    <text x="56" y="282" class="m"><tspan class="gr">● tunnel online</tspan><tspan class="dim"> → </tspan><tspan class="cy">https://&lt;tunnel&gt;/mcp/&lt;token&gt;</tspan><tspan class="dim">  ·  </tspan><tspan class="ye">this very update went through it</tspan></text>
    <text x="30" y="314" class="m"><tspan class="gr b">➜</tspan><tspan class="cy b">  ~/dev</tspan><tspan class="dim"> git:(</tspan><tspan class="rd">main</tspan><tspan class="dim">) </tspan><tspan class="fg"></tspan><tspan class="fg">█<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
