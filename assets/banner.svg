<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="s9y@earth terminal banner">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#70a5fd" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#70a5fd" stop-opacity="0"/>
    </linearGradient>
    
    <clipPath id="screen"><rect x="1" y="1" width="898" height="328" rx="10"/></clipPath>
    <style>
      .m  { font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace; font-size:14px }
      .dim{ fill:#565f89 } .fg { fill:#c0caf5 } .cy { fill:#7dcfff } .gr { fill:#9ece6a }
      .ye { fill:#e0af68 } .ma { fill:#bb9af7 } .rd { fill:#f7768e } .bl { fill:#70a5fd }
      .b  { font-weight:700 }
    </style>
  </defs>

  <rect x=".5" y=".5" width="899" height="329" rx="10.5" fill="#1a1b26" stroke="#2f3348"/>

  <g clip-path="url(#screen)">
    <rect x="1" y="1" width="898" height="30" fill="#16161e"/>
    <circle cx="22" cy="16" r="5.5" fill="#f7768e"/>
    <circle cx="40" cy="16" r="5.5" fill="#e0af68"/>
    <circle cx="58" cy="16" r="5.5" fill="#9ece6a"/>
    <text x="450" y="21" class="m dim" text-anchor="middle">s9y@earth: ~/dev — zsh — 96×24</text>

    <rect x="1" y="31" width="898" height="110" fill="url(#scan)">
      <animate attributeName="y" values="31;290;31" dur="9s" repeatCount="indefinite"/>
    </rect>

        <!-- ASCII art personal mark: s9y, plain monospace glyphs -->
        <g font-family="'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="14" xml:space="preserve" style="white-space: pre">
          <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/>
          <text x="36" y="60" fill="#0f0f14">
            <tspan x="34" dy="0">██████╗&#160;█████╗&#160;&#160;██╗&#160;&#160;&#160;██╗</tspan>
            <tspan x="34" dy="16">██╔═══╝&#160;██╔══██╗╚██╗&#160;██╔╝</tspan>
            <tspan x="34" dy="16">║█████╗&#160;║██████║&#160;╚████╔╝&#160;</tspan>
            <tspan x="34" dy="16">╚═══██║&#160;╚═══██╔╝&#160;&#160;╚██╔╝&#160;&#160;</tspan>
            <tspan x="34" dy="16">██████║&#160;█████╔╝&#160;&#160;&#160;&#160;██║&#160;&#160;&#160;</tspan>
            <tspan x="34" dy="16">╚═════╝&#160;╚════╝&#160;&#160;&#160;&#160;&#160;╚═╝&#160;&#160;&#160;</tspan>
          </text>
          <text x="34" y="58" fill="#7dcfff">
            <tspan x="34" dy="0">██████╗&#160;█████╗&#160;&#160;██╗&#160;&#160;&#160;██╗</tspan>
            <tspan x="34" dy="16">██╔═══╝&#160;██╔══██╗╚██╗&#160;██╔╝</tspan>
            <tspan x="34" dy="16">║█████╗&#160;║██████║&#160;╚████╔╝&#160;</tspan>
            <tspan x="34" dy="16">╚═══██║&#160;╚═══██╔╝&#160;&#160;╚██╔╝&#160;&#160;</tspan>
            <tspan x="34" dy="16">██████║&#160;█████╔╝&#160;&#160;&#160;&#160;██║&#160;&#160;&#160;</tspan>
            <tspan x="34" dy="16">╚═════╝&#160;╚════╝&#160;&#160;&#160;&#160;&#160;╚═╝&#160;&#160;&#160;</tspan>
          </text>
        </g>
        <text x="34" y="170" class="m dim">ship it · then polish</text>

    <g class="m">
      <text x="404" y="72"><tspan class="bl b">s9y</tspan><tspan class="dim">@</tspan><tspan class="bl b">earth</tspan></text>
      <text x="404" y="90" class="dim">───────────────────────────────</text>
      <text x="404" y="112"><tspan class="ma b">OS</tspan><tspan class="dim">     · </tspan><tspan class="fg">Earth (x86_64)</tspan></text>
      <text x="404" y="132"><tspan class="ma b">Uptime</tspan><tspan class="dim"> · </tspan><tspan class="fg">shipping since 2025</tspan></text>
      <text x="404" y="152"><tspan class="ma b">Shell</tspan><tspan class="dim">  · </tspan><tspan class="fg">TypeScript / Go / Python</tspan></text>
      <text x="404" y="172"><tspan class="ma b">WM</tspan><tspan class="dim">     · </tspan><tspan class="fg">Three.js · Babylon.js · PlayCanvas</tspan></text>
      <text x="404" y="192"><tspan class="ma b">Focus</tspan><tspan class="dim">  · </tspan><tspan class="fg">grand strategy · AI · realtime 3D</tspan></text>
      <g>
        <rect x="404" y="204" width="20" height="10" fill="#f7768e"/>
        <rect x="426" y="204" width="20" height="10" fill="#e0af68"/>
        <rect x="448" y="204" width="20" height="10" fill="#9ece6a"/>
        <rect x="470" y="204" width="20" height="10" fill="#7dcfff"/>
        <rect x="492" y="204" width="20" height="10" fill="#70a5fd"/>
        <rect x="514" y="204" width="20" height="10" fill="#bb9af7"/>
        <rect x="536" y="204" width="20" height="10" fill="#c0caf5"/>
      </g>
    </g>

    <line x1="30" y1="222" x2="870" y2="222" stroke="#2f3348"/>

    <g class="m">
      <g opacity="1">
        <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.01s" fill="freeze"/>
        <text x="30" y="248"><tspan class="gr b">➜</tspan><tspan class="cy b">  ~/dev</tspan><tspan class="dim"> git:(</tspan><tspan class="rd">main</tspan><tspan class="dim">) </tspan><tspan class="fg">whoami --verbose</tspan></text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.01s" fill="freeze"/>
        <text x="30" y="270" class="ye">Coding like it’s 2050, but debugging like it’s 1999.</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.01s" fill="freeze"/>
        <text x="30" y="298"><tspan class="gr b">➜</tspan><tspan class="cy b">  ~/dev</tspan><tspan class="dim"> git:(</tspan><tspan class="rd">main</tspan><tspan class="dim">) </tspan><tspan class="fg">git push origin main</tspan><tspan class="fg">█<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="1.9s" repeatCount="indefinite"/></tspan></text>
      </g>
    </g>
  </g>
</svg>
